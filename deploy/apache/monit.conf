# ============================================================
# Monit — Apache 虚拟主机配置（mod_rewrite 伪静态）
# 用法：
#   1. 启用模块：a2enmod rewrite headers expires ssl
#   2. 复制到 /etc/apache2/sites-available/monit.conf 并 a2ensite monit
#   3. 替换 ServerName 与 DocumentRoot（必须指向 public/）
#   4. apachectl configtest && systemctl reload apache2
# 说明：项目自带 public/.htaccess（Laravel 标准伪静态），
#       AllowOverride All 后无需手写 Rewrite 规则。
# ============================================================

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    # ACME 挑战放行（certbot）
    ProxyPass "/.well-known/acme-challenge/" "!"
    Redirect permanent / https://your-domain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    # --- 证书（certbot 会自动填充） ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/your-domain.com/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    # --- Laravel 根目录（必须指向 public/） ---
    DocumentRoot /var/www/monit/public
    <Directory /var/www/monit/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All          # 启用 public/.htaccess 伪静态
        Require all granted
    </Directory>

    # --- PHP-FPM（推荐，替代 mod_php） ---
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    <Proxy "unix:/run/php/php8.3-fpm.sock|fcgi://localhost">
        ProxySet timeout=120
    </Proxy>

    # --- 安全头 ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Gzip ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript image/svg+xml
    </IfModule>

    # --- 静态资源缓存 ---
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/webp "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType text/css "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType font/woff2 "access plus 30 days"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/monit-error.log
    CustomLog ${APACHE_LOG_DIR}/monit-access.log combined
</VirtualHost>
