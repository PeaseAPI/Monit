# ============================================================
# Monit — Nginx 站点配置（生产推荐）
# 用法：
#   1. 复制到 /etc/nginx/sites-available/monit.conf 并软链到 sites-enabled/
#   2. 替换 server_name 为你的域名；root 指向项目 public/ 目录
#   3. nginx -t && systemctl reload nginx
# 证书建议：certbot --nginx -d your-domain.com
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # ACME 挑战（certbot 签发/续期）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com www.your-domain.com;

    # --- 证书（certbot 会自动填充；自签请自行替换路径） ---
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # --- Laravel 根目录（必须指向 public/） ---
    root /var/www/monit/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20m;

    # --- Laravel 伪静态：全部请求回退 index.php ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # 按实际 FPM 版本调整
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # --- 静态资源长缓存（Vite 构建产物带内容哈希，可安全长缓存） ---
    location ~* \.(js|css|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- 像素采集端点（高频）：关闭访问日志、允许跨站 POST ---
    location /pixel-track/ {
        access_log off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        try_files $uri /index.php?$query_string;
    }

    # --- 禁止访问隐藏文件与敏感目录（双保险，public/.htaccess 同样兜底 Apache） ---
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* /(storage/framework|storage/logs|bootstrap/cache) {
        deny all;
    }

    # --- Gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml image/svg+xml;

    # --- 浏览器安全头（可选，按需启用） ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
