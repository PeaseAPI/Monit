services:
  monit:
    build: .
    container_name: monit-app
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8080"
      APP_KEY: "${APP_KEY:-}"
      APP_CRON_KEY: "${APP_CRON_KEY:-change-me-cron-key}"
      DB_CONNECTION: mysql
      DB_HOST: monit-db
      DB_PORT: "3306"
      DB_DATABASE: monit
      DB_USERNAME: monit
      DB_PASSWORD: monit-secret
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
      MAIL_MAILER: log
    volumes:
      - monit-data:/var/www/html/storage
    restart: unless-stopped
    depends_on:
      monit-db:
        condition: service_healthy

  monit-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: monit
      MYSQL_USER: monit
      MYSQL_PASSWORD: monit-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-secret"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  monit-data:
  mysql-data:
